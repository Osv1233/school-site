<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Flexbox сторінка</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #172033;
      background: #f3f7fb;
    }

    .page {
      margin: 0;
      padding: 20px;
      background: #f2f2f2;
    }

    header, footer {
      text-align: center;
      background: #1f7a8c;
      color: white;
    }

    header {
      padding: 30px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    ul{
        margin: 0;
        padding:0;
      }
    ul li{
          List-style: none;}
    a{
      text-decoration: none;
      }

      nav {
            background-color: rgb(0, 187, 197);
            border-color:rgb(0, 115, 186);
            min-height: 54px;
            }
            
      nav li{
            float: left;
            width: 100px;
            }

      nav a{
            display: block;
            Line-height: 4em;
            color: white;
            font-weight: bold;
            text-align: center;
      }

      nav li a:hover{
            color: rgb(255, 3, 3);
            background-color: rgb(98, 203, 0);
      }


    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 16px;
      align-items: center;
      flex-direction: column;
    }

    .box {

      flex: 0 0 calc(33.33% - 10px);
      min-height: 250px;
      padding: 20px;
      border: 1px solid gray;
      background: white;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .box img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      margin-bottom: 10px;
    }

    .box h2 {
      margin: 10px 0;
      font-size: 22px;
      color: #12355b;
    }

    .box p {
      margin: 0;
      max-width: 260px;
      line-height: 1.5;
    }

    footer {
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>
