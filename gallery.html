<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Flexbox сторінка</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #172033;
      background: #cfe7ff;
    }

    .page {
      padding: 20px;
      background: #f2f2f2;
    }

    header, footer {
      text-align: center;
      background: #1f7a8c;
      color: white;
    }

    header {
      padding: 30px 20px;
    }

    header h1 {
      margin: 0;
    }

    ul {
      margin: 0;
      padding: 0;
    }

    ul li {
      list-style: none;
    }

    a {
      text-decoration: none;
    }

      nav {
            background-color: rgb(0, 187, 197);
            border-color:rgb(0, 115, 186);
            min-height: 54px;
            }
            
      nav li{
            float: left;
            width: 100px;
            }

      nav a{
            display: block;
            Line-height: 4em;
            color: white;
            font-weight: bold;
            text-align: center;
      }

      nav li a:hover{
            color: rgb(255, 3, 3);
            background-color: rgb(98, 203, 0);
      }



    .row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }

    .item {
      text-align: center;
    }

    .item img {
      width: 400px;
      height: 300px;
      object-fit: cover;
    }

    .item p {
      margin-top: 10px;
    }

    footer {
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>
